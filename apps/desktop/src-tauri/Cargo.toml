[package]
name = "synkka"
version = "0.1.0"
description = "Synkka – tiedostojen synkronointi"
authors = ["Synkka"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "synkka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.6.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "2.5.0"
fs2 = "0.4.3"
rand = "0.9"
tokio = { version = "1.54.1", features = ["time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }  # localhost HTTP only
tauri-plugin-autostart = "2.7.0"
